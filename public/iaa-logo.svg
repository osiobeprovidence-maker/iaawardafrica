<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="iaaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A01F"/>
      <stop offset="50%" stop-color="#C9971C"/>
      <stop offset="100%" stop-color="#996E0D"/>
    </linearGradient>
    <linearGradient id="iaaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8471C"/>
      <stop offset="100%" stop-color="#C9340B"/>
    </linearGradient>
    <linearGradient id="iaaGoldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="50%" stop-color="#F2A01F"/>
      <stop offset="100%" stop-color="#FAF8F4"/>
    </linearGradient>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 5)">
    <!-- Outer Shield / Circle -->
    <circle cx="40" cy="40" r="36" fill="#0B0B0B" stroke="url(#iaaGold)" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="32" fill="none" stroke="#F2A01F" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.7"/>
    
    <!-- Crown / Crest Geometry -->
    <path d="M22 46 C 18 34 26 22 40 18 C 54 22 62 34 58 46 C 54 58 46 64 40 64 C 34 64 26 58 22 46 Z" fill="none" stroke="url(#iaaGold)" stroke-width="1.8"/>
    <!-- Top 5-point Star -->
    <polygon points="40,12 43,19 50,20 44,25 46,32 40,28 34,32 36,25 30,20 37,19" fill="url(#iaaOrange)"/>
    
    <!-- Monogram letters -->
    <text x="40" y="47" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="18" fill="url(#iaaGold)" text-anchor="middle" letter-spacing="1">IAA</text>
    
    <!-- Small star under -->
    <polygon points="40,53 41.5,56.5 45,57 42.5,59.5 43,63 40,61 37,63 37.5,59.5 35,57 38.5,56.5" fill="#F2A01F"/>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(98, 20)">
    <!-- Main Title -->
    <text x="0" y="24" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="22" fill="#FAF8F4" letter-spacing="3.5">
      ICONIC AWARDS
    </text>
    <!-- Subtitle: AFRICA -->
    <text x="0" y="44" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="url(#iaaOrange)" letter-spacing="7">
      AFRICA
    </text>
    <line x1="90" y1="39" x2="260" y2="39" stroke="url(#iaaGold)" stroke-width="1" opacity="0.6"/>
    <text x="175" y="44" font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="#F2A01F" letter-spacing="1.5">
      7TH EDITION
    </text>
  </g>
</svg>
